<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">The agent loop</title>
  <desc id="desc">A goal and context enter a model. The model proposes a tool call. The harness checks validation and permission, then the tool acts in the outside world. The observation returns to the model's context, and the loop repeats until the goal is met or a stopping condition fires.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C24E2C"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8A8D"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3A2D20" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #FBF7EF; }
      .frame { fill: none; stroke: #DED2C0; stroke-width: 1.5; }
      .card { fill: #FFFDF8; stroke: #D8CCBA; stroke-width: 1.2; }
      .kicker { font: 700 12px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; letter-spacing: 2px; fill: #7A6A59; }
      .num { font: 700 13px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #FFFDF8; }
      .h { font: 700 19px Georgia, "Times New Roman", serif; fill: #203039; }
      .body { font: 400 14px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #51626B; }
      .small { font: 400 12.5px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #6C787B; }
      .label { font: 600 12px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #9A4A2B; }
      .loopbar { fill: #F1E7D6; stroke: #DCCCB4; stroke-width: 1.2; }
      .stopcard { fill: #203039; }
      .stoptext { fill: #FBF7EF; }
      .stopsmall { fill: #C9D2CF; }
      .line { stroke: #C24E2C; stroke-width: 2; fill: none; }
      .dash { stroke: #7A8A8D; stroke-width: 1.7; fill: none; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect class="bg" width="1080" height="500" rx="18"/>
  <rect class="frame" x="0.75" y="0.75" width="1078.5" height="498.5" rx="17.25"/>
  <text x="40" y="46" class="kicker">THE AGENT LOOP</text>
  <text x="40" y="76" class="h">A goal goes in. A checked action goes out.</text>

  <!-- Goal -->
  <rect x="40" y="130" width="180" height="120" rx="12" class="card" filter="url(#shadow)"/>
  <circle cx="64" cy="154" r="12" fill="#203039"/>
  <text x="64" y="158.5" text-anchor="middle" class="num">1</text>
  <text x="84" y="159" class="h" style="font-size:16px">Goal</text>
  <text x="58" y="188" class="body">What you asked for,</text>
  <text x="58" y="208" class="body">plus the current</text>
  <text x="58" y="228" class="body">context and tools.</text>

  <!-- Model -->
  <rect x="280" y="130" width="220" height="120" rx="12" class="card" filter="url(#shadow)"/>
  <circle cx="304" cy="154" r="12" fill="#1E6B62"/>
  <text x="304" y="158.5" text-anchor="middle" class="num">2</text>
  <text x="324" y="159" class="h" style="font-size:16px">Model decides</text>
  <text x="298" y="188" class="body">Chooses the next tool,</text>
  <text x="298" y="208" class="body">arguments, or a</text>
  <text x="298" y="228" class="body">final answer.</text>

  <!-- Harness -->
  <rect x="560" y="130" width="200" height="120" rx="12" class="card" filter="url(#shadow)"/>
  <circle cx="584" cy="154" r="12" fill="#D9A441"/>
  <text x="584" y="158.5" text-anchor="middle" class="num" style="fill:#203039">3</text>
  <text x="604" y="159" class="h" style="font-size:16px">Harness checks</text>
  <text x="578" y="188" class="body">Validates input,</text>
  <text x="578" y="208" class="body">permissions, approval,</text>
  <text x="578" y="228" class="body">and limits.</text>

  <!-- Tool -->
  <rect x="820" y="130" width="220" height="120" rx="12" class="card" filter="url(#shadow)"/>
  <circle cx="844" cy="154" r="12" fill="#C24E2C"/>
  <text x="844" y="158.5" text-anchor="middle" class="num">4</text>
  <text x="864" y="159" class="h" style="font-size:16px">Tool acts</text>
  <text x="838" y="188" class="body">The server reads,</text>
  <text x="838" y="208" class="body">drafts, queries, or</text>
  <text x="838" y="228" class="body">sends in the world.</text>

  <!-- arrows top -->
  <path class="line" d="M 220 190 H 272" marker-end="url(#arrow)"/>
  <path class="line" d="M 500 190 H 552" marker-end="url(#arrow)"/>
  <text x="526" y="181" text-anchor="middle" class="label">tool call</text>
  <path class="line" d="M 760 190 H 812" marker-end="url(#arrow)"/>
  <text x="786" y="181" text-anchor="middle" class="label">approved</text>

  <!-- observation bar -->
  <path class="dash" d="M 930 250 V 350" marker-end="url(#arrowMuted)"/>
  <rect x="280" y="350" width="760" height="76" rx="12" class="loopbar"/>
  <text x="306" y="381" class="h" style="font-size:16px">Observation returns</text>
  <text x="306" y="404" class="body">Tool results, errors, and retrieved content are added to the model's context. Then it decides again.</text>
  <path class="line" d="M 280 388 C 240 388 235 250 280 230" marker-end="url(#arrow)" fill="none"/>
  <text x="232" y="322" class="label" transform="rotate(-90 232 322)" text-anchor="middle">repeat</text>

  <!-- stop -->
  <rect x="40" y="350" width="180" height="76" rx="12" class="stopcard"/>
  <text x="60" y="379" class="body" style="fill:#FBF7EF;font-weight:700">STOP WHEN</text>
  <text x="60" y="400" class="stopsmall" style="font-size:12px">goal met · approval needed</text>
  <text x="60" y="416" class="stopsmall" style="font-size:12px">limit reached · no progress</text>
  <path class="dash" d="M 390 250 C 390 285 130 280 130 342" marker-end="url(#arrowMuted)"/>
</svg>
