<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of an agent tool</title>
  <desc id="desc">The model sees a tool's name, description, input schema, and annotations. A permission boundary in the host and server controls its use. The tool executes against files, APIs, or databases and returns text, structured data, or an error.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C24E2C"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8A8D"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3A2D20" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #FBF7EF; }
      .frame { fill: none; stroke: #DED2C0; stroke-width: 1.5; }
      .kicker { font: 700 12px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; letter-spacing: 2px; fill: #7A6A59; }
      .h { font: 700 21px Georgia, "Times New Roman", serif; fill: #203039; }
      .card { fill: #FFFDF8; stroke: #D8CCBA; stroke-width: 1.2; }
      .label { font: 700 11.5px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #9A4A2B; }
      .title { font: 700 15px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #203039; }
      .body { font: 400 13px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #51626B; }
      .mono { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #34545A; }
      .chip { fill: #EEF4F1; stroke: #C9DCD6; }
      .chiptext { font: 600 11.5px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #1E6B62; }
      .boundary { fill: #F6EDE6; stroke: #E2C6B5; }
      .lock { fill: #9A4A2B; }
      .line { stroke: #C24E2C; stroke-width: 2; fill: none; }
      .mutedline { stroke: #7A8A8D; stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect class="bg" width="1080" height="560" rx="18"/>
  <rect class="frame" x="0.75" y="0.75" width="1078.5" height="558.5" rx="17.25"/>
  <text x="40" y="44" class="kicker">ANATOMY OF A TOOL</text>
  <text x="40" y="74" class="h">A menu item for the model, with real-world consequences.</text>

  <!-- model sees -->
  <rect x="40" y="112" width="265" height="310" rx="12" class="card" filter="url(#shadow)"/>
  <text x="62" y="143" class="label">THE MODEL SEES</text>
  <text x="62" y="172" class="title">Name</text>
  <text x="62" y="192" class="body">count_words</text>
  <text x="62" y="222" class="title">Description</text>
  <text x="62" y="242" class="body">What it does, when to use it,</text>
  <text x="62" y="260" class="body">and what it will not do.</text>
  <text x="62" y="290" class="title">Input schema</text>
  <text x="62" y="310" class="body">Required fields, types,</text>
  <text x="62" y="328" class="body">limits, allowed values.</text>
  <text x="62" y="358" class="title">Annotations</text>
  <text x="62" y="378" class="body">Hints such as read-only.</text>
  <text x="62" y="396" class="body">Useful, not enforcement.</text>

  <!-- tool card -->
  <rect x="365" y="94" width="360" height="430" rx="14" fill="#203039" filter="url(#shadow)"/>
  <text x="389" y="127" class="label" style="fill:#D9A441">TOOL DEFINITION</text>
  <text x="389" y="157" class="title" style="fill:#FBF7EF;font-size:18px">count_words</text>
  <text x="389" y="178" class="mono" style="fill:#C9D2CF">read-only · closed-world</text>

  <rect x="385" y="198" width="320" height="100" rx="8" fill="#2B3F48"/>
  <text x="403" y="222" class="mono" style="fill:#B9D8D0">description</text>
  <text x="403" y="244" class="mono" style="fill:#EDE5D8">“Count words in the text</text>
  <text x="403" y="263" class="mono" style="fill:#EDE5D8">you provide. Do not save</text>
  <text x="403" y="282" class="mono" style="fill:#EDE5D8">or send it anywhere.”</text>

  <rect x="385" y="312" width="320" height="94" rx="8" fill="#2B3F48"/>
  <text x="403" y="336" class="mono" style="fill:#B9D8D0">inputSchema</text>
  <text x="403" y="358" class="mono" style="fill:#EDE5D8">text: string</text>
  <text x="403" y="378" class="mono" style="fill:#EDE5D8">required · 1–100,000 chars</text>
  <text x="403" y="395" class="mono" style="fill:#8FB3AC">additionalProperties: false</text>

  <!-- boundary -->
  <rect x="385" y="422" width="320" height="78" rx="8" class="boundary"/>
  <path d="M 405 441 h 11 v 10 h -11 z M 407 441 v -4 a 4 4 0 0 1 8 0 v 4" class="lock" fill="none" stroke="#9A4A2B" stroke-width="1.8"/>
  <text x="425" y="450" style="font:700 12px ui-sans-serif;fill:#9A4A2B">Permission boundary</text>
  <text x="403" y="470" class="body" style="font-size:12px">Enforced by the host and server,</text>
  <text x="403" y="486" class="body" style="font-size:12px">not by the prompt.</text>

  <!-- results -->
  <rect x="790" y="142" width="240" height="260" rx="12" class="card" filter="url(#shadow)"/>
  <text x="812" y="173" class="label">THE WORLD RETURNS</text>
  <rect x="812" y="194" width="196" height="50" rx="7" fill="#EEF4F1"/>
  <text x="826" y="214" class="title" style="font-size:12.5px">Text result</text>
  <text x="826" y="232" class="body" style="font-size:11.5px">Readable answer for the chat.</text>
  <rect x="812" y="254" width="196" height="50" rx="7" fill="#F6EDE6"/>
  <text x="826" y="274" class="title" style="font-size:12.5px">Structured content</text>
  <text x="826" y="292" class="body" style="font-size:11.5px">Fields, IDs, statuses, totals.</text>
  <rect x="812" y="314" width="196" height="50" rx="7" fill="#F2EDE4"/>
  <text x="826" y="334" class="title" style="font-size:12.5px">Error or limit</text>
  <text x="826" y="352" class="body" style="font-size:11.5px">What failed; what to try next.</text>
  <text x="812" y="388" class="body" style="font-size:11.5px">Results are data, not instructions.</text>

  <!-- external systems -->
  <rect x="790" y="430" width="240" height="94" rx="12" fill="#F1E7D6" stroke="#DCCCB4"/>
  <text x="812" y="456" class="label" style="fill:#7A6A59">EXECUTED AGAINST</text>
  <rect x="812" y="470" width="58" height="29" rx="14" class="chip"/>
  <text x="841" y="489" text-anchor="middle" class="chiptext">Files</text>
  <rect x="878" y="470" width="54" height="29" rx="14" class="chip"/>
  <text x="905" y="489" text-anchor="middle" class="chiptext">APIs</text>
  <rect x="940" y="470" width="74" height="29" rx="14" class="chip"/>
  <text x="977" y="489" text-anchor="middle" class="chiptext">Database</text>

  <!-- arrows -->
  <path class="line" d="M 305 265 H 357" marker-end="url(#arrow)"/>
  <text x="331" y="255" text-anchor="middle" class="body" style="font-size:11px">call</text>
  <path class="line" d="M 725 240 H 782" marker-end="url(#arrow)"/>
  <text x="753" y="230" text-anchor="middle" class="body" style="font-size:11px">result</text>
  <path class="mutedline" d="M 910 314 V 400" marker-end="url(#arrowMuted)"/>
  <path class="mutedline" d="M 790 366 C 750 366 750 530 625 530" marker-end="url(#arrowMuted)"/>
  <text x="635" y="546" class="body" style="font-size:11px">back to the loop</text>
</svg>
